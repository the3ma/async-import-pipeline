[project]
name = "async-import-pipeline"
version = "0.1.0"
description = "Reference architecture: async file imports with signed uploads, edge validation, a worker pool and WebSocket results."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8", "websockets>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs the Docker Compose stack (make up)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S101"]
